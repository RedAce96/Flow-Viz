[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pelecpost"
version = "0.1.0"
description = "Recipe-driven PeleC CFD post-processing"
requires-python = ">=3.11"
dependencies = [
  "h5py>=3.10",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pillow>=10",
  "pydantic>=2.8",
  "pyyaml>=6",
  "rich>=13",
  "scipy>=1.12",
  "typer>=0.9",
  "yt>=4.3",
]

[project.optional-dependencies]
dev = [
  "coverage>=7",
  "mypy>=1.11",
  "mkdocs>=1.6",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML>=6",
]

[project.scripts]
pelec-post = "pelecpost.cli:main"

[tool.setuptools]
packages = {find = {include = ["pelecpost*"]}}
py-modules = [
  "compact_probes",
  "pp_functions_database",
  "pp_modal_database",
  "pp_plotting_database",
  "pp_probe_store",
]

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy", "pelecpost/legacy_driver.py"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
follow_imports = "silent"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "pelecpost.legacy_driver"
ignore_errors = true
